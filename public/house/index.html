<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>House Walkthrough</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0c0c; color: #f2f0ec;
      font: 15px/1.5 system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
    canvas { display: block; }
    #overlay { position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer; text-align: center;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.6)); transition: opacity .35s; }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay > div { padding: 0 16px; }
    #progress { font-size: 18px; letter-spacing: .02em; }
    #hint { margin-top: 10px; font-size: 13px; opacity: .6; }
  </style>
  <script type="module" crossorigin src="/house/assets/index-DHrlcm0N.js"></script>
</head>
<body>
  <div id="overlay">
    <div>
      <div id="progress">Loading…</div>
      <div id="hint">Arrow keys to walk and turn · click to look with the mouse · Shift to hurry · Esc to pause</div>
    </div>
  </div>
  <script>
    // phone navigation mode (?nav=pad|tap|tour to compare; tour won the persona QA, see qa/findings.md), and the
    // right hint from the first frame
    if (matchMedia('(pointer: coarse)').matches) {
      const nav = new URLSearchParams(location.search).get('nav') || 'tour';
      document.documentElement.dataset.nav = nav;
      document.getElementById('hint').textContent = {
        pad: 'Arrow pad to walk and turn · drag to look around',
        tap: 'Tap the floor to walk there · drag to look around',
        tour: 'Pick a room below, or tap the floor to walk there · drag to look around',
      }[nav] ?? '';
    }
  </script>
</body>
</html>
